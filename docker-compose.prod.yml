# Stack de producción: Nginx (estáticos + FastCGI), PHP-FPM y MySQL.
# Uso (la imagen de Nginx parte de car-agency-api:prod, por eso se construye
# primero la app):
#   cp .env.production.example .env.production   # completar CHANGE_ME_*
#   docker compose -f docker-compose.prod.yml --env-file .env.production build app
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# El compose de desarrollo (docker-compose.yml) no se toca. Este archivo publica
# solo el puerto 80; MySQL queda aislado en la red interna.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: car-agency-api:prod
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.production
    volumes:
      # Persistencia de logs, sesiones, cachés de framework y vistas compiladas.
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - car-agency-prod

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    image: car-agency-api-nginx:prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - car-agency-prod

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - car-agency-prod

volumes:
  app-storage:
  mysql-data:

networks:
  car-agency-prod:
    driver: bridge

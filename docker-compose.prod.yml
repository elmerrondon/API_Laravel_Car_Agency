# Stack de producción: Nginx (estáticos + FastCGI), PHP-FPM y PostgreSQL.
# Uso (la imagen de Nginx parte de car-agency-laravel-api:prod, por eso se construye
# primero la app):
#   cp .env.production.example .env.production   # completar CHANGE_ME_*
#   docker compose -f docker-compose.prod.yml --env-file .env.production build app
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app php artisan migrate --force
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app php artisan optimize
#
# El compose de desarrollo (docker-compose.yml) no se toca. Este archivo publica
# solo el puerto 80; PostgreSQL queda aislado en la red interna.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: car-agency-laravel-api:prod
    restart: unless-stopped
    working_dir: /var/www/html
    # Lista explícita en lugar de `env_file`: `.env.production` también contiene
    # POSTGRES_PASSWORD (superusuario) y los ajustes del servidor PostgreSQL, que
    # la API no necesita. Aquí solo viajan las variables de aplicación; las de
    # `postgres` se quedan en su servicio. Los valores se interpolan desde
    # `--env-file .env.production`, que ya usan todos los comandos del README.
    environment:
      APP_NAME: "${APP_NAME:-Car Agency}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
      ADMIN_LAST_NAME: "${ADMIN_LAST_NAME:-General}"
      ADMIN_CODE: "${ADMIN_CODE:-USR-0001}"
      ADMIN_DOCUMENT_NUMBER: "${ADMIN_DOCUMENT_NUMBER:-V-00000001}"
      API_VERSION: "${API_VERSION:-1.0.0}"
      DOCS_ENABLED: "${DOCS_ENABLED:-false}"
      SCRAMBLE_DEV_TOOLS: "${SCRAMBLE_DEV_TOOLS:-false}"
      SANCTUM_EXPIRATION: "${SANCTUM_EXPIRATION:-120}"
      SANCTUM_LAST_USED_AT: "${SANCTUM_LAST_USED_AT:-false}"
      SANCTUM_TOKEN_PREFIX: "${SANCTUM_TOKEN_PREFIX:-car_}"
      PERMISSIONS_CACHE_TTL: "${PERMISSIONS_CACHE_TTL:-300}"
      STATS_CACHE_TTL: "${STATS_CACHE_TTL:-45}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      HSTS_ENABLED: "${HSTS_ENABLED:-false}"
      HSTS_MAX_AGE: "${HSTS_MAX_AGE:-31536000}"
      HSTS_INCLUDE_SUBDOMAINS: "${HSTS_INCLUDE_SUBDOMAINS:-false}"
      RATE_LIMIT_LOGIN: "${RATE_LIMIT_LOGIN:-5}"
      RATE_LIMIT_LOGIN_IP: "${RATE_LIMIT_LOGIN_IP:-20}"
      RATE_LIMIT_API_ANON: "${RATE_LIMIT_API_ANON:-30}"
      RATE_LIMIT_API: "${RATE_LIMIT_API:-120}"
      RATE_LIMIT_REPORTS: "${RATE_LIMIT_REPORTS:-30}"
      RATE_LIMIT_REPORTS_PDF: "${RATE_LIMIT_REPORTS_PDF:-5}"
      RATE_LIMIT_HEALTH: "${RATE_LIMIT_HEALTH:-30}"
      RATE_LIMIT_AUDIT_EXPORT: "${RATE_LIMIT_AUDIT_EXPORT:-10}"
      REPORTS_MAX_ROWS: "${REPORTS_MAX_ROWS:-300}"
      SALES_MIN_DATE: "${SALES_MIN_DATE:-2000-01-01}"
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-90}"
      ENFORCE_PASSWORD_CHANGE: "${ENFORCE_PASSWORD_CHANGE:-false}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      APP_LOCALE: "${APP_LOCALE:-es}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-es}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-es_ES}"
      BCRYPT_ROUNDS: "${BCRYPT_ROUNDS:-12}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-api_laravel_car_agency}"
      DB_USERNAME: "${DB_USERNAME:-car_agency}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatoria}"
      DB_SSLMODE: "${DB_SSLMODE:-prefer}"
      DB_TIMEZONE: "${DB_TIMEZONE:-UTC}"
      DB_URL: "${DB_URL:-}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      CACHE_DRIVER: "${CACHE_DRIVER:-database}"
      CACHE_PREFIX: "${CACHE_PREFIX:-car_agency}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
      SESSION_PATH: "${SESSION_PATH:-/}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-null}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-null}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-null}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-no-reply@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Car Agency}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-false}"
    volumes:
      # Persistencia de logs, sesiones, cachés de framework y vistas compiladas.
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);' && php artisan health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - car-agency-prod

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    image: car-agency-laravel-api-nginx:prod
    restart: unless-stopped
    # Solo loopback: el TLS lo termina un proxy del host (Caddy, Nginx, Traefik)
    # o la superposición docker-compose.tls.yml. Nunca se publica HTTP plano.
    ports:
      - "127.0.0.1:80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      # `service_started` y no `service_healthy`: el primer despliegue aún no
      # tiene tablas, así que el healthcheck (DB + caché) falla hasta ejecutar
      # `migrate`. Nginx debe arrancar para poder completar el paso 4.
      app:
        condition: service_started
    networks:
      - car-agency-prod

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    env_file:
      - .env.production
    environment:
      # Locale C.UTF-8: el orden de texto va por bytes (sin ICU). El encoding
      # debe ser UTF8 para los acentos de los datos en español.
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---locale=C.UTF-8 --encoding=UTF8}
    # Ajuste del servidor: shared_buffers ≈ 25 % de la RAM del servidor (512 MB
    # por defecto) y log de consultas lentas a partir de 1 s (en `docker compose
    # logs postgres`). En un servidor de 2 GB usa 512MB/1GB; con 4 GB, 1GB/2GB.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:-1000}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - car-agency-prod

  # Worker de colas: procesa los jobs de la tabla `jobs` (QUEUE_CONNECTION=database).
  # Reutiliza imagen, entorno y volumen de `app`; no publica puertos. `--max-time`
  # recicla el proceso cada hora para liberar memoria y `restart` lo relanza.
  worker:
    extends: app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    restart: unless-stopped
    healthcheck:
      disable: true

  # Programador de tareas: `audit:prune` y `sanctum:prune-expired`.
  # Reutiliza imagen, entorno y volumen de `app`; no publica puertos y no
  # hereda el healthcheck de PHP-FPM porque aquí no se sirve HTTP.
  scheduler:
    extends: app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

volumes:
  app-storage:
  pg-data:

networks:
  car-agency-prod:
    driver: bridge
    # Fija la subnet que TRUSTED_PROXIES declara en .env.production: Nginx es
    # el par inmediato de la app y su IP debe caer dentro de este rango para
    # que ClientIpResolver acepte X-Forwarded-For y X-Forwarded-Proto.
    ipam:
      config:
        - subnet: 172.28.0.0/16

; Ajustes de PHP para el contenedor de la API.
; Los reportes en PDF de Dompdf consumen ~0,4 MB de memoria por fila
; (500 ventas ≈ 216 MB), así que el límite por defecto de 128 MB no basta.
memory_limit = 512M

; El API solo recibe JSON pequeño; no hace falta más.
post_max_size = 8M
upload_max_filesize = 8M

; No revelar la versión de PHP en las cabeceras.
expose_php = Off

session.upload_progress.enabled = 0
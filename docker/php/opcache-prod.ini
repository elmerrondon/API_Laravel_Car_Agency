; OPcache del target `prod` (solo se copia en esa etapa del Dockerfile).
;
; El código no cambia dentro del contenedor: se hornea en la imagen y se
; recrea en cada despliegue. Por eso no hace falta revalidar timestamps en
; cada petición y OPcache puede servir los scripts ya compilados.
;
; - memory_consumption=128 MB y max_accelerated_files=10000 cubren de sobra
;   las ~10 000 clases del vendor actual (el default de 2 000 provoca purgas).
; - validate_timestamps=0 exige reiniciar/recrear `app` tras cada despliegue
;   (el contenedor nuevo arranca con la caché vacía y la reconstruye).
; - JIT desactivado: esta API está limitada por E/S y PostgreSQL, no por CPU; el
;   JIT añade memoria y tiempo de compilación sin mejora medible.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.jit=off
opcache.jit_buffer_size=0

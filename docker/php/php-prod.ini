; Errores de PHP solo para la etapa `prod` de docker/php/Dockerfile.
; La imagen oficial de PHP no activa ningún php.ini, así que sin este archivo
; los valores por defecto dejan `display_errors` visible en la respuesta y
; `log_errors` apagado. En desarrollo se conservan los valores por defecto para
; poder depurar; este archivo solo se copia en el target `prod`.
display_errors = Off
display_startup_errors = Off
log_errors = On
; PHP-FPM arranca con `catch_workers_output = yes`, así que stderr llega a
; `docker compose logs app` (y a la plataforma en la vía PaaS).
error_log = /dev/stderr
html_errors = Off
expose_php = Off

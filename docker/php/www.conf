; Pool de PHP-FPM de la API (desarrollo y producción comparten la misma imagen base).
;
; `pm.max_children` se calcula con la RAM del host o del límite del contenedor:
;
;     pm.max_children = floor((RAM_MB - 512) / 75)
;
; 512 MB quedan reservados para el sistema, PostgreSQL y Nginx; 75 MB es el
; consumo medio de un worker con esta API (OPcache y Dompdf incluidos, sin PDFs
; grandes).
; Valores de referencia:
;
;   RAM   | max_children
;   1 GB  | 7
;   2 GB  | 20
;   4 GB  | 47
;   8 GB  | 102
;
; Si cambias este valor, recrea el contenedor (`docker compose up -d --force-recreate app`
; o, en producción, `... up -d --force-recreate app worker scheduler`): FPM solo
; lee el pool al arrancar. `pm.max_requests = 500` recicla cada worker para
; evitar fugas de memoria y `request_terminate_timeout` corta peticiones que
; superen el `fastcgi_read_timeout` de Nginx (60s).
[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

pm.max_requests = 500
request_terminate_timeout = 60s

; Los workers heredan las variables del contenedor (env_file de Compose).
clear_env = no

; Los errores de los workers van a stderr para que `docker compose logs` los vea.
catch_workers_output = yes
decorate_workers_output = no

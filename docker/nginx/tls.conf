# TLS propio dentro del stack (superposición docker-compose.tls.yml).
# El puerto 80 solo redirige; todo el tráfico de negocio viaja por 443.
# Los certificados se montan en /etc/nginx/certs (fullchain.pem + privkey.pem).

# CSP solo para la documentación interactiva: Stoplight Elements carga JS y CSS
# desde unpkg.com y usa scripts inline.
map $request_uri $docs_csp {
    default "";
    ~^/docs/api(\?.*)?$ "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://unpkg.com; font-src 'self' data: https://unpkg.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Conserva el host y la ruta; los clientes y buscadores actualizan el enlace.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    # Mismo límite que post_max_size/upload_max_filesize de docker/php/php.ini.
    client_max_body_size 8m;

    # Compresión de respuestas de texto. Los PDF no se comprimen nunca: ya
    # están comprimidos y gzip solo añadiría CPU y latencia.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json text/csv text/plain;

    # HSTS lo añade la aplicación (AddHstsHeader) solo sobre HTTPS para no duplicar.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $docs_csp always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # TLS termina en este Nginx: Laravel debe ver la petición como segura
        # aunque el socket con PHP-FPM sea HTTP. Se sobrescribe el valor que
        # pudiera enviar el cliente para que no se pueda falsear el esquema.
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        # Un solo salto: la IP real del cliente es la que conecta con este
        # Nginx. Se sobrescribe cualquier X-Forwarded-For que enviara el
        # cliente para que ClientIpResolver y los limitadores no la falsifiquen.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

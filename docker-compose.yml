services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: car-agency-laravel-api:dev
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: api_laravel_car_agency
      # Usuario de aplicación (no root), creado por la imagen de MySQL.
      DB_USERNAME: car_agency
      DB_PASSWORD: secret
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD-SHELL", "php artisan health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - car-agency

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - app
    networks:
      - car-agency

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    ports:
      # Solo loopback: la base de desarrollo no se expone a la red local.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_laravel_car_agency}
      # Superusuario del contenedor: solo lo usa la inicialización y los backups.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      # Rol de aplicación sin privilegios de administración (lo crea
      # docker/postgres/init/01-app-role.sh en el primer arranque).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-car_agency}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-secret}
      # En desarrollo se crea además la base `testing` que usa phpunit-postgres.xml.
      POSTGRES_CREATE_TESTING_DB: ${POSTGRES_CREATE_TESTING_DB:-true}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - car-agency

  # Ejecuta `audit:prune` y `sanctum:prune-expired` según routes/console.php.
  # Reutiliza la imagen y el entorno de `app` sin publicar puertos.
  scheduler:
    extends: app
    command: ["php", "artisan", "schedule:work"]

volumes:
  vendor:
  pg-data:

networks:
  car-agency:
    driver: bridge

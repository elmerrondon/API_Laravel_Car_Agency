services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: car-agency-laravel-api:dev
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: api_laravel_car_agency
      # Usuario de aplicación (no root), creado por la imagen de MySQL.
      DB_USERNAME: car_agency
      DB_PASSWORD: secret
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - car-agency

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - car-agency

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      # Solo loopback: la base de desarrollo no se expone a la red local.
      - "127.0.0.1:3306:3306"
    # Buffer pool = 25-50 % de la RAM del host (256M por defecto para desarrollo).
    # El log lento va a la tabla `mysql.slow_log` (consultable con SQL).
    command:
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      - --slow-query-log=ON
      - --long-query-time=${MYSQL_LONG_QUERY_TIME:-1}
      - --log-output=TABLE
    environment:
      MYSQL_DATABASE: api_laravel_car_agency
      # Usuario de aplicación sin privilegios de administración. La app nunca
      # conecta como root.
      MYSQL_USER: car_agency
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psecret --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - car-agency

  # Ejecuta `audit:prune` y `sanctum:prune-expired` según routes/console.php.
  # Reutiliza la imagen y el entorno de `app` sin publicar puertos.
  scheduler:
    extends: app
    command: ["php", "artisan", "schedule:work"]

volumes:
  vendor:
  mysql-data:

networks:
  car-agency:
    driver: bridge

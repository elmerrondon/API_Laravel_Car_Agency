# Superposición opcional para terminar TLS dentro del stack, sin un proxy del
# host. Uso:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml \
#     --env-file .env.production up -d
#
# Requiere `docker/certs/fullchain.pem` y `docker/certs/privkey.pem` (ver README,
# sección «TLS propio dentro del stack»). La vía recomendada sigue siendo un
# proxy externo: este archivo existe para VPS sin proxy o con certificados
# emitidos por una CA interna.
#
# `!override` sustituye los puertos del compose base; sin él, Compose sumaría
# `127.0.0.1:80` y `80:80` y el arranque fallaría por puerto duplicado.
services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    # El puerto 80 solo redirige a 443, así que el healthcheck heredado
    # (`wget http://127.0.0.1/up`) recibiría un 301 y fallaría. Se sondea por
    # HTTPS y sin validar el certificado: el montaje puede ser una CA interna o
    # un certificado emitido para el dominio real, no para 127.0.0.1.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

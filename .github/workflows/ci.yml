name: CI de calidad

# Workflow independiente del de Docker Hub: valida la suite, el análisis
# estático y el formato en cada push y pull request.
#
# Dos jobs:
# - `quality`: matriz PHP 8.2/8.3/8.4 (el rango declarado en composer.json)
#   sobre SQLite en memoria, sin servicios.
# - `postgres`: PHP 8.3 contra un PostgreSQL 17 real, con migraciones,
#   seeders y la suite completa. SQLite no reproduce el cotejo binario, los
#   índices de expresión ni los tipos `numeric` de PostgreSQL.
#
# La imagen de desarrollo usa PHP 8.3.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, exif, gd, mbstring, pcntl, pdo_pgsql, pdo_sqlite, zip, dom
          coverage: none
          tools: composer:v2

      - name: Cache de Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Suite de tests
        run: composer test

      - name: Análisis estático
        run: composer analyse

      - name: Formato
        run: ./vendor/bin/pint --test

      - name: Vulnerabilidades de dependencias
        run: composer audit

  postgres:
    name: PostgreSQL 17
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Estas variables ganan al `.env` (Dotenv se carga como inmutable), así que
    # `php artisan` y la suite apuntan a la base `testing` del servicio.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, exif, gd, mbstring, pcntl, pdo_pgsql, pdo_sqlite, zip, dom
          coverage: none
          tools: composer:v2

      - name: Cache de Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.3-pgsql-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-pgsql-composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Migrar y sembrar PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Suite contra PostgreSQL
        run: composer test:postgres

      - name: Análisis estático
        run: composer analyse

      - name: Formato
        run: ./vendor/bin/pint --test

      - name: Vulnerabilidades de dependencias
        run: composer audit
